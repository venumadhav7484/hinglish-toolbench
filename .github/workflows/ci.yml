name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Unit tests (fixture dataset, fake model clients; no network, no API key)
        run: uv run pytest -q
      - name: Dataset structure and checksum
        run: uv run htb validate
      - name: Re-score every committed run (submissions must match their raw outputs)
        run: uv run htb verify
