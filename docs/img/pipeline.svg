t-anchor="middle" font-weight="600" >pass checks</text><path class="arrowh" d="M529,93 l8,5 l-8,5 z"/><text x="376.0" y="154.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >Sonnet 5.5 + code: values</text><text x="376.0" y="169.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >kept, nothing added,</text><text x="376.0" y="184.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >right script, natural.</text><text x="376.0" y="199.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >161 rewrites</text><rect class="s3" x="542" y="62" width="152" height="72" rx="12"/><text x="618.0" y="96.0" class="codet" font-size="26" text-anchor="middle" font-weight="800" >205</text><text x="618.0" y="120.0" class="codet" font-size="13" text-anchor="middle" font-weight="600" >scenarios kept</text><path class="arrowh" d="M699,93 l8,5 l-8,5 z"/><text x="546.0" y="154.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >only if all 5 versions</text><text x="546.0" y="169.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >pass, so every comparison</text><text x="546.0" y="184.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >is paired. 27 dropped</text><rect class="soft" x="712" y="62" width="152" height="72" rx="12"/><text x="788.0" y="96.0" class="t1" font-size="26" text-anchor="middle" font-weight="800" >0</text><text x="788.0" y="120.0" class="t2" font-size="13" text-anchor="middle" font-weight="600" >human-reviewed</text><text x="716.0" y="154.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >native-speaker pass: htb</text><text x="716.0" y="169.0" class="t3" font-size="11" text-anchor="start" font-weight="400" >review (to do)</text></svg>