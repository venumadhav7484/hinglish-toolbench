<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 202" width="880" height="202" role="img" aria-labelledby="t d"><title id="t">How a call is judged</title><desc id="d">Call at all?: missing detail or out of scope → no call (27 false calls); Right tools?: same set of tool names, any order (64 wrong / missed); Valid call?: arguments pass the tool&#x27;s JSON Schema (0 invalid); Right arguments?: numbers, dates, enums exact; names across scripts (11 wrong values)</desc><style>
.bg{fill:#fcfcfb;stroke:#e3e2dd} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#8a8984} .base{stroke:#c9c8c2}
